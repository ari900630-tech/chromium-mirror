<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrome Mirror</title>
<style>
body{margin:0;background:#202124;font-family:Arial;color:white;height:100vh;display:flex;flex-direction:column}
.tabs{height:48px;background:#171717;display:flex;align-items:center;padding:0 12px;gap:8px}.tab{background:#303134;padding:10px 24px;border-radius:12px 12px 0 0}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px;background:#303134}.btn{background:#3c4043;border:0;color:white;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}.btn:active{background:white;color:#1a73e8}.url{flex:1;background:#202124;border-radius:24px;padding:12px 20px;color:#aaa}
.page{flex:1;display:flex;align-items:center;justify-content:center}.logo{font-size:48px;font-weight:bold;color:#8ab4f8}
</style>
</head>
<body>
<div class="tabs"><div class="tab">כרטיסייה חדשה</div></div>
<div class="toolbar"><button class="btn">←</button><button class="btn">→</button><button class="btn">↻</button><div class="url">חפש או הקלד כתובת</div><button class="btn">⋮</button></div>
<div class="page"><div class="logo">Chrome</div></div>
</body>
</html>
