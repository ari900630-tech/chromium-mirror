<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome Mirror</title><style>*{box-sizing:border-box}body{margin:0;background:#202124;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column}.tabs{height:48px;background:#171717;display:flex;align-items:end;padding:0 12px;gap:8px}.tab{background:#303134;padding:14px 45px;border-radius:14px 14px 0 0}.toolbar{display:flex;align-items:center;gap:10px;padding:12px;background:#303134}.btn{width:42px;height:42px;border:0;border-radius:50%;background:#3c4043;color:white;font-size:20px;cursor:pointer}.btn:active{background:#fff;color:#1a73e8}.address{flex:1;background:#202124;border:1px solid #555;border-radius:24px;padding:12px 18px;color:#fff}.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px}.logo{font-size:52px;font-weight:bold}.card{background:#303134;border-radius:18px;padding:20px;width:70%;text-align:center}.menu{position:absolute;top:110px;left:20px;background:#303134;border-radius:16px;padding:15px;display:none}.menu div{padding:12px}</style></head><body><div class="tabs"><div class="tab">+ כרטיסייה חדשה</div></div><div class="toolbar"><button class="btn" onclick="history.back()">←</button><button class="btn" onclick="history.forward()">→</button><button class="btn" onclick="location.reload()">↻</button><input class="address" placeholder="חפש או הקלד כתובת"><button class="btn" onclick="document.querySelector('.menu').style.display='block'">⋮</button></div><div class="home"><div class="logo">Chrome</div><div class="card">חפש באינטרנט או הקלד כתובת</div></div><div class="menu"><div>היסטוריה</div><div>סימניות</div><div>הגדרות</div></div><script src="app.js"></script></body></html>
